services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valcv}
      POSTGRES_USER: ${POSTGRES_USER:-valcv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valcv_dev_password}
    ports:
      - "15439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valcv} -d ${POSTGRES_DB:-valcv}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://valcv:valcv_dev_password@db:5432/valcv}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      UPLOAD_DIR: /app/uploads
    ports:
      - "18429:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "18673:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
